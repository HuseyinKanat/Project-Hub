# sonar-project.properties — static SonarQube scanner config for project-hub (PH-194).
#
# Single multi-language project (NOT per-language keys): the PH-193 poller resolves
# exactly ONE projectKey per board (resolve_project_key() — backend/app/services/sonarqube.py),
# and the scanner natively analyses Python + TypeScript in one project via multiple
# sonar.sources dirs. The scanner WRITE and the poller READ must agree on this key.
#
# CONSISTENCY CONTRACT: sonar.projectKey below MUST equal the PH board's resolved key.
#   Operator sets either Board.sonarqube_project_key='project-hub'
#   OR SONARQUBE_PROJECT_KEY_MAP={"PH":"project-hub"} in .env (see .env.example).
#
# SECRETS / HOST are injected at runtime by scripts/sonar-scan.sh from env
# (SONAR_HOST_URL=$SONARQUBE_URL, SONAR_TOKEN=$SONARQUBE_TOKEN). DO NOT hardcode
# sonar.host.url / sonar.token / sonar.login here — a committed token is a hard reject.

sonar.projectKey=project-hub
sonar.projectName=project-hub

# Multi-language sources: backend Python + frontend TypeScript in one project.
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,tests

# Keep generated / vendored / non-source paths out of the analysis.
sonar.exclusions=**/node_modules/**,**/migrations/**,**/__pycache__/**,frontend/dist/**,**/*.spec.ts,docs/**

# Backend Python coverage (PH-208). scripts/sonar-scan.sh generates this Cobertura
# report (pytest --cov=app, [tool.coverage.run] relative_files=true) into the
# scanner-mounted workspace BEFORE the scan. Path is relative to the scanner CWD
# (repo root, mounted RO at /usr/src) and is NOT matched by sonar.exclusions above.
# Without this, coverage/new_coverage stay structurally 0.0% and the gate is stuck red.
sonar.python.coverage.reportPaths=backend/coverage.xml

sonar.python.version=3.11
sonar.sourceEncoding=UTF-8
