services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # PH-228: broaden the read-only repo mount from a single project-hub sub-path
      # to the whole host $HOME, so every board's repos_path (translated via
      # services.repo_paths.to_container_path → /repos/<rel>) is visible under
      # repos_root (/repos). :ro is preserved (reader is read-only + allowlist-
      # validated); ${PROJECTS_ROOT} override is kept for CI/alternate layouts.
      # NOTE: this exposes the whole host home read-only to the backend container
      # (acceptable for a local single-user dev tool — see PH-228 R4).
      - ${PROJECTS_ROOT:-${HOME}}:/repos:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    env_file: .env
    environment:
      - BACKEND_HOST_INTERNAL=backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

  # --- SonarQube Community Build (PH-191 epic / PH-192 infra root) ---
  # Self-hosted code-quality server. Opt-in: nothing else depends on it and the
  # backend reads SONARQUBE_* only when SONARQUBE_ENABLED=true (consumers land in
  # PH-193+), so the rest of the stack boots normally even if sonar is never started.
  #
  # ⚠️  HOST PREREQUISITE — vm.max_map_count >= 262144 (embedded Elasticsearch).
  # SonarQube's bundled Elasticsearch refuses to start otherwise
  # (log: "max virtual memory areas vm.max_map_count [65530] is too low").
  # This is a HOST kernel knob, NOT a compose sysctl — set it once before starting:
  #
  #   # macOS / Docker Desktop (resets on Docker Desktop restart):
  #   docker run --rm --privileged alpine sysctl -w vm.max_map_count=262144
  #   # Linux host (persistent):
  #   echo 'vm.max_map_count=262144' | sudo tee /etc/sysctl.d/99-sonarqube.conf && sudo sysctl --system
  #
  # Also bump Docker Desktop memory to >= 6 GB (SonarQube + ES wants ~2-4 GB).
  # First boot runs ES init + DB schema migration (~1-3 min) — early DOWN is normal.
  # One-time User-token bootstrap + full runbook: see .env.example and PH-197.
  sonarqube-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${SONARQUBE_DB_USER:-sonarqube}
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonarqube}
      POSTGRES_DB: ${SONARQUBE_DB_NAME:-sonarqube}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONARQUBE_DB_USER:-sonarqube}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No host port published — only reachable on the compose network by sonarqube.

  sonarqube:
    image: sonarqube:25.9.0.112764-community   # pinned Community Build; bump deliberately (avoid floating :community)
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONARQUBE_DB_NAME:-sonarqube}
      SONAR_JDBC_USERNAME: ${SONARQUBE_DB_USER:-sonarqube}
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonarqube}
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # status=UP means embedded ES + web are ready; first boot is slow (see comment above).
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20      # first-boot ES init ~1-3 min — generous retries
      start_period: 120s

  # --- One-shot sonar-scanner (PH-194) — PROFILE-GATED, never starts on `docker compose up` ---
  # Profile "scan" keeps this out of the default `up`/`config --services` set; it only
  # runs on demand via `docker compose --profile scan run --rm sonar-scanner`
  # (that is exactly what scripts/sonar-scan.sh invokes after merge-to-main).
  # Joining the default compose network lets sonar.host.url=http://sonarqube:9000 resolve
  # from inside the container. The repo is bind-mounted read-only at /usr/src (the
  # scanner-cli WORKDIR) so it picks up sonar-project.properties at the repo root.
  # Secrets/host come from env at run time (SONAR_HOST_URL / SONAR_TOKEN) — none committed.
  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:11
    profiles: ["scan"]
    environment:
      SONAR_HOST_URL: ${SONARQUBE_URL:-http://sonarqube:9000}
      SONAR_TOKEN: ${SONARQUBE_TOKEN:-}
    volumes:
      - .:/usr/src:ro
    working_dir: /usr/src

volumes:
  postgres_data:
  redis_data:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
