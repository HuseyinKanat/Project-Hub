<!-- @dsCard group="Colors" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
/* Each tier shown on its real surface + a solid color bar so the difference reads */
.stack{display:flex;flex-direction:column;gap:12px}
.tier{display:flex;align-items:center;gap:16px;background:var(--bg-surface);border:1px solid var(--hairline);border-radius:10px;padding:14px 16px}
.bar{width:56px;height:38px;border-radius:7px;flex-shrink:0}
.samp{font-size:20px;font-weight:600;flex:1}
.meta{text-align:right}
.role{font-size:11px;color:var(--text-muted);display:block}
</style></head>
<body>
<div class="stack">
  <div class="tier"><div class="bar" style="background:#E6EDF3"></div><span class="samp" style="color:#E6EDF3">Primary — headings & body</span><div class="meta"><span class="hex">#E6EDF3</span><span class="role">AA on base</span></div></div>
  <div class="tier"><div class="bar" style="background:#9FB0C0"></div><span class="samp" style="color:#9FB0C0">Secondary — labels & meta</span><div class="meta"><span class="hex">#9FB0C0</span><span class="role">supporting</span></div></div>
  <div class="tier"><div class="bar" style="background:#5C6B7A"></div><span class="samp" style="color:#5C6B7A">Muted — placeholder & meta</span><div class="meta"><span class="hex">#5C6B7A</span><span class="role">de-emphasis</span></div></div>
</div>
</body></html>
