<!-- @dsCard group="Components" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.row{gap:26px;align-items:center}
.grp{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text-secondary)}
.cb{width:18px;height:18px;border-radius:5px;border:1px solid var(--hairline-strong);background:var(--bg-inset);display:flex;align-items:center;justify-content:center}
.cb.on{background:var(--accent-strong);border-color:var(--accent);color:var(--text-on-accent);font-size:12px;font-weight:700}
.sw{width:36px;height:20px;border-radius:9999px;background:var(--bg-inset);border:1px solid var(--hairline);position:relative}
.sw.on{background:var(--accent-strong);border-color:var(--accent);box-shadow:var(--glow-cyan-sm)}
.knob{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--text-muted)}
.sw.on .knob{left:18px;background:#fff}
.rd{width:18px;height:18px;border-radius:50%;border:1px solid var(--hairline-strong);background:var(--bg-inset)}
.rd.on{border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--accent)}
</style></head>
<body>
<div class="row">
  <div class="grp"><span class="cb on">✓</span> Checked</div>
  <div class="grp"><span class="cb"></span> Unchecked</div>
  <div class="grp"><span class="sw on"><span class="knob"></span></span> On</div>
  <div class="grp"><span class="sw"><span class="knob"></span></span> Off</div>
  <div class="grp"><span class="rd on"></span> Selected</div>
  <div class="grp"><span class="rd"></span> Option</div>
</div>
</body></html>
