<!-- @dsCard group="Components" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
body{padding:24px;background:radial-gradient(circle at 30% 30%,rgba(34,211,238,.05),transparent 60%),var(--bg-base);background-size:16px 16px,cover;display:flex;align-items:center;gap:18px}
.node{display:flex;flex-direction:column;gap:3px;background:var(--bg-surface);border:1px solid var(--hairline);border-radius:10px;padding:12px 16px;min-width:120px;position:relative}
.node.active{border-color:var(--accent);box-shadow:var(--glow-cyan)}
.dot{width:10px;height:10px;border-radius:50%;position:absolute;top:-4px;left:-4px;border:2px solid var(--bg-base)}
.nm{font-family:var(--font-mono);font-size:13px;color:var(--text-primary);font-weight:500}
.tag{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.edge{flex:1;height:2px;background:linear-gradient(90deg,var(--accent),transparent);position:relative}
.edge::after{content:"→";position:absolute;right:-2px;top:-11px;color:var(--accent);font-size:16px}
.gate{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-family:var(--font-mono);font-size:9px;color:var(--text-muted);white-space:nowrap;background:var(--bg-raised);border:1px solid var(--hairline);padding:1px 6px;border-radius:5px}
</style></head>
<body>
<div class="node"><i class="dot" style="background:var(--state-in_progress)"></i><span class="nm">in_progress</span><span class="tag">state</span></div>
<div class="edge"><span class="gate">req: technical_depth</span></div>
<div class="node active"><i class="dot" style="background:var(--state-in_review)"></i><span class="nm">in_review</span><span class="tag">active</span></div>
</body></html>
