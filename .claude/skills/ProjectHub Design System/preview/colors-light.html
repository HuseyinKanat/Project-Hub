<!-- @dsCard group="Colors" -->
<!doctype html><html class="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg-base);padding:20px;font-family:var(--font-sans);display:flex;gap:14px;align-items:stretch}
.mock{flex:1;background:var(--bg-surface);border:1px solid var(--hairline);border-radius:12px;box-shadow:var(--shadow-md);padding:14px;display:flex;flex-direction:column;gap:10px}
.k{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border:1px solid var(--hairline-cyan);padding:2px 7px;border-radius:6px;align-self:flex-start;white-space:nowrap}
.t{font-size:14px;font-weight:600;color:var(--text-primary);line-height:1.35}
.btn{align-self:flex-start;background:var(--accent-strong);color:var(--text-on-accent);font-size:12px;font-weight:500;padding:7px 12px;border-radius:8px;box-shadow:var(--glow-cyan-sm)}
.swr{display:flex;gap:8px;margin-top:auto}
.sw{width:34px;height:22px;border-radius:6px;border:1px solid var(--hairline-strong)}
.lab{font-size:11px;color:var(--text-muted)}
.row{display:flex;flex-direction:column;gap:6px}
</style></head>
<body>
<div class="mock">
  <span class="k">PH-167</span>
  <div class="t">Cyan on White — light variant</div>
  <span class="btn">New ticket</span>
  <div class="swr">
    <div class="row"><div class="sw" style="background:var(--bg-base)"></div><span class="lab">base</span></div>
    <div class="row"><div class="sw" style="background:var(--bg-raised)"></div><span class="lab">raised</span></div>
    <div class="row"><div class="sw" style="background:var(--accent)"></div><span class="lab">accent</span></div>
    <div class="row"><div class="sw" style="background:var(--success)"></div><span class="lab">ok</span></div>
    <div class="row"><div class="sw" style="background:var(--danger)"></div><span class="lab">err</span></div>
  </div>
</div>
<div class="mock" style="align-items:flex-start;justify-content:center">
  <span class="lab" style="font-family:var(--font-mono)">html.light</span>
  <div class="t" style="font-weight:500;color:var(--text-secondary);font-size:12px">Same tokens, retuned: surfaces lighten, cyan deepens to <span style="color:var(--accent);font-weight:600">#0891B2</span> for AA on white, shadows replace glow as the elevation cue.</div>
</div>
</body></html>
