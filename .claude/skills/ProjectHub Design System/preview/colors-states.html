<!-- @dsCard group="Colors" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.stack{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:9999px;font-family:var(--font-mono);font-size:12px;font-weight:500}
.d{width:8px;height:8px;border-radius:50%}
</style></head>
<body>
<div class="stack">
  <span class="pill" style="background:color-mix(in srgb,var(--state-backlog) 12%,transparent);color:var(--state-backlog);border:1px solid color-mix(in srgb,var(--state-backlog) 36%,transparent)"><i class="d" style="background:var(--state-backlog)"></i>backlog</span>
  <span class="pill" style="background:color-mix(in srgb,var(--state-to_do) 12%,transparent);color:var(--state-to_do);border:1px solid color-mix(in srgb,var(--state-to_do) 36%,transparent)"><i class="d" style="background:var(--state-to_do)"></i>to_do</span>
  <span class="pill" style="background:color-mix(in srgb,var(--state-in_progress) 12%,transparent);color:var(--state-in_progress);border:1px solid color-mix(in srgb,var(--state-in_progress) 36%,transparent)"><i class="d" style="background:var(--state-in_progress)"></i>in_progress</span>
  <span class="pill" style="background:color-mix(in srgb,var(--state-blocked) 12%,transparent);color:var(--state-blocked);border:1px solid color-mix(in srgb,var(--state-blocked) 36%,transparent)"><i class="d" style="background:var(--state-blocked)"></i>blocked</span>
  <span class="pill" style="background:color-mix(in srgb,var(--state-in_review) 12%,transparent);color:var(--state-in_review);border:1px solid color-mix(in srgb,var(--state-in_review) 36%,transparent)"><i class="d" style="background:var(--state-in_review)"></i>in_review</span>
  <span class="pill" style="background:color-mix(in srgb,var(--state-in_test) 12%,transparent);color:var(--state-in_test);border:1px solid color-mix(in srgb,var(--state-in_test) 36%,transparent)"><i class="d" style="background:var(--state-in_test)"></i>in_test</span>
  <span class="pill" style="background:color-mix(in srgb,var(--state-done) 12%,transparent);color:var(--state-done);border:1px solid color-mix(in srgb,var(--state-done) 36%,transparent)"><i class="d" style="background:var(--state-done)"></i>done</span>
</div>
</body></html>
