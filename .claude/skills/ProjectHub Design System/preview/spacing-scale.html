<!-- @dsCard group="Spacing" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.col{gap:9px}
.line{display:flex;align-items:center;gap:12px}
.bar{height:14px;background:var(--accent-soft);border-right:2px solid var(--accent);border-radius:2px}
.t{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);width:74px}
</style></head>
<body>
<div class="col" id="s"></div>
<script>
const sc=[["1",4],["2",8],["3",12],["4",16],["5",20],["6",24],["8",32],["10",40],["12",48]];
document.getElementById('s').innerHTML=sc.map(([n,px])=>`<div class="line"><span class="t">space-${n}</span><div class="bar" style="width:${px}px"></div><span class="t">${px}px</span></div>`).join('');
</script>
</body></html>
