<!-- @dsCard group="Colors" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.stack{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.tile{display:flex;flex-direction:column;gap:8px}
.bk{height:56px;border-radius:12px;border:1px solid var(--hairline-cyan)}
.nm{font-size:12px;color:var(--text-secondary);font-weight:500}
.glow{box-shadow:var(--glow-cyan)}
</style></head>
<body>
<div class="stack">
  <div class="tile"><div class="bk glow" style="background:var(--accent)"></div><span class="nm">accent</span><span class="hex">#22D3EE</span></div>
  <div class="tile"><div class="bk" style="background:var(--accent-hover)"></div><span class="nm">hover</span><span class="hex">#38DEF6</span></div>
  <div class="tile"><div class="bk" style="background:var(--accent-strong)"></div><span class="nm">strong</span><span class="hex">#06B6D4</span></div>
  <div class="tile"><div class="bk" style="background:var(--accent-active)"></div><span class="nm">active</span><span class="hex">#0891B2</span></div>
  <div class="tile"><div class="bk" style="background:var(--accent-soft)"></div><span class="nm">soft</span><span class="hex">12% α</span></div>
</div>
</body></html>
