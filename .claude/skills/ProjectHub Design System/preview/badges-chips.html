<!-- @dsCard group="Components" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.col{gap:12px}
.row{gap:8px;align-items:center}
.kchip{font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--accent);background:var(--accent-soft);border:1px solid var(--hairline-cyan);padding:2px 8px;border-radius:6px}
.type{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:5px}
.prio{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary)}
.pd{width:8px;height:8px;border-radius:50%}
.label{font-size:11px;color:var(--text-secondary);background:var(--bg-raised);border:1px solid var(--hairline);padding:2px 9px;border-radius:9999px}
</style></head>
<body>
<div class="col">
  <div class="row">
    <span class="kchip">PH-167</span>
    <span class="type" style="color:var(--lane-emerald);background:color-mix(in srgb,var(--lane-emerald) 14%,transparent)">feature</span>
    <span class="type" style="color:var(--lane-rose);background:color-mix(in srgb,var(--lane-rose) 14%,transparent)">bug</span>
    <span class="type" style="color:var(--lane-sky);background:color-mix(in srgb,var(--lane-sky) 14%,transparent)">task</span>
    <span class="type" style="color:var(--lane-violet);background:color-mix(in srgb,var(--lane-violet) 14%,transparent)">epic</span>
  </div>
  <div class="row">
    <span class="prio"><i class="pd" style="background:var(--text-muted)"></i>low</span>
    <span class="prio"><i class="pd" style="background:var(--info)"></i>medium</span>
    <span class="prio"><i class="pd" style="background:var(--warning)"></i>high</span>
    <span class="prio"><i class="pd" style="background:var(--danger)"></i>urgent</span>
    <span class="label">git-integration</span>
    <span class="label">phase:frontend</span>
  </div>
</div>
</body></html>
