<!-- @dsCard group="Components" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
/* sit the card on a faint backdrop + raised fill + visible border so it reads on dark */
body{padding:20px;background:radial-gradient(120% 120% at 50% 0%,#0a0f17,#04060a)}
.card{width:284px;background:var(--bg-raised);border:1px solid var(--hairline-strong);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:9px;box-shadow:0 8px 24px -10px rgba(0,0,0,.8)}
.top{display:flex;justify-content:space-between;align-items:center}
.key{font-family:var(--font-mono);font-size:12px;color:var(--text-secondary);white-space:nowrap}
.type{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--lane-sky);background:color-mix(in srgb,var(--lane-sky) 16%,transparent);padding:2px 7px;border-radius:5px}
.title{font-size:14px;font-weight:500;color:var(--text-primary);line-height:1.4}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted)}
.prio{display:inline-flex;align-items:center;gap:6px}
.pd{width:8px;height:8px;border-radius:50%;background:var(--warning)}
.phase{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-family:var(--font-mono);color:var(--accent);background:var(--accent-soft);border:1px solid var(--hairline-cyan);padding:4px 8px;border-radius:7px}
.dp{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:p 1.4s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.35}}
.labels{display:flex;gap:6px}
.lb{font-size:10px;color:var(--text-secondary);background:var(--bg-surface);border:1px solid var(--hairline);padding:2px 8px;border-radius:9999px;white-space:nowrap}
</style></head>
<body>
<div class="card">
  <div class="top"><span class="key">PH-167</span><span class="type">task</span></div>
  <div class="title">Branch graph UX rework — SourceTree-style list + commit→diff</div>
  <div class="phase"><i class="dp"></i>jarwis-frontend · coding</div>
  <div class="meta"><span class="prio"><i class="pd"></i>high</span><span>6m · jarwis-pm</span></div>
  <div class="labels"><span class="lb">git-integration</span><span class="lb">phase:frontend</span></div>
</div>
</body></html>
