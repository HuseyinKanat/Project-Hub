<!-- @dsCard group="Components" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--hairline);position:relative}
.tab{padding:10px 16px;font-size:13px;font-weight:500;color:var(--text-secondary);cursor:pointer;position:relative}
.tab.active{color:var(--accent)}
.tab.active::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px;box-shadow:var(--glow-cyan-sm)}
.cnt{font-size:10px;background:var(--bg-raised);border:1px solid var(--hairline);border-radius:9999px;padding:1px 6px;margin-left:6px;color:var(--text-muted)}
</style></head>
<body>
<div class="tabs">
  <div class="tab active">All <span class="cnt" style="color:var(--accent);border-color:var(--hairline-cyan)">28</span></div>
  <div class="tab">Comments <span class="cnt">3</span></div>
  <div class="tab">History <span class="cnt">33</span></div>
  <div class="tab">Git <span class="cnt">2</span></div>
</div>
</body></html>
