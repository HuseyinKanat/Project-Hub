<!-- @dsCard group="Components" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
body{padding:0;background:var(--bg-surface)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{position:sticky;top:0;text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);padding:11px 16px;background:var(--bg-inset);border-bottom:1px solid var(--hairline)}
td{padding:11px 16px;border-bottom:1px solid var(--hairline);color:var(--text-secondary)}
tr:hover td{background:var(--bg-raised)}
.actor{color:var(--text-primary);font-weight:500}
.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.role{font-size:11px;font-family:var(--font-mono);padding:2px 8px;border-radius:9999px}
.tag{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:4px}
</style></head>
<body>
<table>
  <thead><tr><th>Actor</th><th>Role</th><th>Type</th><th>Perms</th></tr></thead>
  <tbody>
    <tr><td class="actor">Admin</td><td><span class="role" style="color:var(--role-admin);background:color-mix(in srgb,var(--role-admin) 14%,transparent)">admin</span></td><td><span class="tag" style="color:var(--success);background:var(--success-soft)">Human</span></td><td class="mono">1 perm</td></tr>
    <tr><td class="actor">jarwis-pm</td><td><span class="role" style="color:var(--role-pm);background:color-mix(in srgb,var(--role-pm) 14%,transparent)">pm</span></td><td><span class="tag" style="color:var(--accent);background:var(--accent-soft)">Agent</span></td><td class="mono">8 perms</td></tr>
    <tr><td class="actor">jarwis-architect</td><td><span class="role" style="color:var(--role-architect);background:color-mix(in srgb,var(--role-architect) 14%,transparent)">architect</span></td><td><span class="tag" style="color:var(--accent);background:var(--accent-soft)">Agent</span></td><td class="mono">7 perms</td></tr>
  </tbody>
</table>
</body></html>
