<!-- @dsCard group="Colors" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.stack{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
.tile{display:flex;flex-direction:column;gap:7px;align-items:center}
.dot{width:34px;height:34px;border-radius:50%}
.nm{font-size:10px;color:var(--text-secondary)}
</style></head>
<body>
<div class="stack">
  <div class="tile"><div class="dot" style="background:var(--lane-cyan)"></div><span class="nm">cyan</span></div>
  <div class="tile"><div class="dot" style="background:var(--lane-teal)"></div><span class="nm">teal</span></div>
  <div class="tile"><div class="dot" style="background:var(--lane-sky)"></div><span class="nm">sky</span></div>
  <div class="tile"><div class="dot" style="background:var(--lane-violet)"></div><span class="nm">violet</span></div>
  <div class="tile"><div class="dot" style="background:var(--lane-amber)"></div><span class="nm">amber</span></div>
  <div class="tile"><div class="dot" style="background:var(--lane-rose)"></div><span class="nm">rose</span></div>
  <div class="tile"><div class="dot" style="background:var(--lane-emerald)"></div><span class="nm">emerald</span></div>
  <div class="tile"><div class="dot" style="background:var(--lane-indigo)"></div><span class="nm">indigo</span></div>
</div>
</body></html>
