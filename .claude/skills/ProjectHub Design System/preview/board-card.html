<!-- @dsCard group="Components" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
body{padding:18px}
.card{width:300px;background:var(--bg-surface);border:1px solid var(--hairline-cyan);border-radius:14px;padding:18px;position:relative;box-shadow:var(--glow-cyan);display:flex;flex-direction:column;gap:10px;overflow:hidden}
.beam{position:absolute;inset:0;border-radius:14px;background:linear-gradient(120deg,transparent,var(--accent-soft),transparent);opacity:.6;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.key{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border:1px solid var(--hairline-cyan);padding:3px 8px;border-radius:6px}
.arrow{color:var(--text-muted);font-size:18px}
.nm{font-size:18px;font-weight:600;color:var(--text-primary)}
.desc{font-size:12px;color:var(--text-muted)}
.chips{display:flex;gap:7px;margin-top:2px}
.ch{font-size:11px;color:var(--text-secondary);background:var(--bg-raised);border:1px solid var(--hairline);padding:3px 9px;border-radius:9999px;font-family:var(--font-mono)}
</style></head>
<body>
<div class="card">
  <div class="beam"></div>
  <div class="top"><span class="key">PH</span><span class="arrow">→</span></div>
  <div class="nm">ProjectHub</div>
  <div class="desc">Default ProjectHub board</div>
  <div class="chips"><span class="ch">web_app</span><span class="ch">7 states</span></div>
</div>
</body></html>
