<!-- @dsCard group="Colors" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.stack{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{display:flex;flex-direction:column;gap:8px}
.bk{height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.nm{font-size:12px;color:var(--text-secondary)}
</style></head>
<body>
<div class="stack">
  <div class="tile"><div class="bk" style="background:var(--success-soft);color:var(--success);border:1px solid var(--success)">success</div><span class="hex">#34D399</span></div>
  <div class="tile"><div class="bk" style="background:var(--warning-soft);color:var(--warning);border:1px solid var(--warning)">warning</div><span class="hex">#FBBF24</span></div>
  <div class="tile"><div class="bk" style="background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger)">danger</div><span class="hex">#F87171</span></div>
  <div class="tile"><div class="bk" style="background:var(--info-soft);color:var(--info);border:1px solid var(--info)">info</div><span class="hex">#38BDF8</span></div>
</div>
</body></html>
