<!-- @dsCard group="Colors" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.stack{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:9999px;font-family:var(--font-mono);font-size:12px;font-weight:500}
.d{width:8px;height:8px;border-radius:50%}
</style></head>
<body>
<div class="stack" id="s"></div>
<script>
const roles=[["admin","--role-admin"],["pm","--role-pm"],["architect","--role-architect"],["backend_dev","--role-backend"],["frontend_dev","--role-frontend"],["reviewer","--role-reviewer"],["qa","--role-qa"],["orchestrator","--role-orchestrator"]];
document.getElementById('s').innerHTML=roles.map(([n,v])=>`<span class="pill" style="background:color-mix(in srgb,var(${v}) 12%,transparent);color:var(${v});border:1px solid color-mix(in srgb,var(${v}) 36%,transparent)"><i class="d" style="background:var(${v})"></i>${n}</span>`).join('');
</script>
</body></html>
