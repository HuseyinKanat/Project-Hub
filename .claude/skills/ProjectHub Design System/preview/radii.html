<!-- @dsCard group="Spacing" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.stack{display:flex;gap:18px;align-items:flex-end}
.tile{display:flex;flex-direction:column;gap:8px;align-items:center}
.bx{width:74px;height:60px;background:var(--bg-raised);border:1px solid var(--hairline-cyan)}
.nm{font-size:11px;color:var(--text-secondary)}
</style></head>
<body>
<div class="stack">
  <div class="tile"><div class="bx" style="border-radius:6px"></div><span class="nm">sm · 6</span></div>
  <div class="tile"><div class="bx" style="border-radius:10px"></div><span class="nm">md · 10</span></div>
  <div class="tile"><div class="bx" style="border-radius:14px"></div><span class="nm">lg · 14</span></div>
  <div class="tile"><div class="bx" style="border-radius:20px"></div><span class="nm">xl · 20</span></div>
  <div class="tile"><div class="bx" style="border-radius:9999px;width:60px"></div><span class="nm">pill</span></div>
</div>
</body></html>
