<!-- @dsCard group="Spacing" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
/* On near-black, elevation reads through surface-lightness + rim border + ambient shadow.
   Backdrop is lifted slightly so the drop shadow is actually visible. */
body{background:#03050880}
.wrap{background:radial-gradient(120% 140% at 50% 0%,#0c1119,#04060a);border-radius:14px;padding:24px;display:flex;gap:20px}
.tile{flex:1;display:flex;flex-direction:column;gap:12px;align-items:center}
.bx{width:100%;height:62px;border-radius:12px}
.e0{background:#0A0E14;border:1px solid #1B2430}
.e1{background:#10151d;border:1px solid #232d3a;box-shadow:0 2px 8px -2px rgba(0,0,0,.7)}
.e2{background:#141a23;border:1px solid #2a3543;box-shadow:0 10px 24px -8px rgba(0,0,0,.85)}
.e3{background:#0c1620;border:1px solid var(--hairline-cyan);box-shadow:var(--glow-cyan)}
.nm{font-size:11px;color:var(--text-secondary);font-weight:500}
.nm.c{color:var(--accent)}
.hex{font-size:10px}
</style></head>
<body>
<div class="wrap">
  <div class="tile"><div class="bx e0"></div><span class="nm">flat</span><span class="hex">surface</span></div>
  <div class="tile"><div class="bx e1"></div><span class="nm">raised</span><span class="hex">shadow-sm</span></div>
  <div class="tile"><div class="bx e2"></div><span class="nm">overlay</span><span class="hex">shadow-lg</span></div>
  <div class="tile"><div class="bx e3"></div><span class="nm c">glow-cyan</span><span class="hex">active / live</span></div>
</div>
</body></html>
