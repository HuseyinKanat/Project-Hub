<!-- @dsCard group="Brand" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
body{display:flex;flex-direction:column;gap:20px;padding:24px;justify-content:center}
.word{font-weight:700;letter-spacing:-0.03em;line-height:1}
.r2{display:flex;align-items:center;gap:28px}
.mono-tile{width:40px;height:40px;border-radius:10px;background:var(--bg-raised);border:1px solid var(--hairline-strong);display:grid;place-items:center;font-family:var(--font-mono);font-weight:700;font-size:15px;color:var(--accent)}
.cap{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
.tile-wrap{display:flex;flex-direction:column;align-items:center}
</style></head>
<body>
<span class="word" style="font-size:32px"><span style="color:var(--text-primary)">Project</span><span style="color:var(--accent)">Hub</span></span>
<div class="r2">
  <span class="word" style="font-size:18px"><span style="color:var(--text-primary)">Project</span><span style="color:var(--accent)">Hub</span></span>
  <div class="tile-wrap"><div class="mono-tile">PH</div></div>
  <span class="word" style="font-size:18px;color:var(--text-primary)">ProjectHub</span>
</div>
</body></html>
